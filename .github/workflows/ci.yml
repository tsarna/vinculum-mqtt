name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Under -race, because some of what this suite guards is only observable
      # to the race detector. TestConcurrentRouteAndRegistration asserts
      # nothing by design — it is a canary for the router's copy-on-write
      # invariant, and a plain `go test` cannot fail it however badly that
      # invariant is broken. The build already covers the non-race compile.
      - name: Test
        run: go test -race ./...
